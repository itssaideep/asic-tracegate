[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asic-tracegate"
version = "0.2.0"
description = "Dependency-free release traceability checker and artifact graph analyzer for ASIC, FPGA, and software releases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Saideep Reddy Tamma", email = "saideep9676@gmail.com" }
]
keywords = [
    "traceability",
    "release-engineering",
    "asic",
    "fpga",
    "verification",
    "provenance",
    "git",
    "supply-chain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/itssaideep/asic-tracegate"
Repository = "https://github.com/itssaideep/asic-tracegate.git"
Issues = "https://github.com/itssaideep/asic-tracegate/issues"

[project.scripts]
tracegate = "tracegate:main"

[tool.setuptools]
py-modules = ["tracegate"]

